name: 좌석 데이터 검사

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v7
      - name: 자바스크립트 문법 검사
        run: |
          node --check dist/seat-data.js
          node --check dist/app.js
          node --check dist/seat-layout.js
          node --check dist/stage-links.js
          node --check dist/group-engine.js
          node --check dist/group-ui.js
          node --check dist/roster-engine.js
          node --check dist/roster-ui.js
      - name: 406석 데이터 검사
        run: node scripts/validate.cjs
      - name: 명단과 자동 배치 검사
        run: node tests/roster-engine.test.cjs
      - name: 회전 좌석과 통로 및 출입문 공간 검사
        run: node tests/seat-layout.test.cjs
      - name: 그룹·비워두기·자동 배치 검사
        run: node tests/group-engine.test.cjs
